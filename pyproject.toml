[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fiatcoin"
version = "0.1.0"
description = "A Bitcoin-like cryptocurrency implemented in Python 3.13"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
  "cryptography>=43.0.0",
  "coincurve>=19.0.0",
  "plyvel>=1.5.0",
  "coincurve",
  "ecdsa",
  "immutables"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "hypothesis>=6.0.0",
  "black>=24.0.0",
  "ruff>=0.6.0",
  "isort>=5.13.0",
  "mypy>=1.8.0",
  "pre-commit>=3.7.0",
  "bandit>=1.7.0",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
strict = true

# Ignore missing stubs for C-extension libs
[[tool.mypy.overrides]]
module = ["plyvel", "coincurve"]
ignore_missing_imports = true
